spring.application.name=pago

server.port=8091

spring.datasource.url=jdbc:mysql://localhost:3306/db_pagos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Ruta donde se generará el JSON de la documentación
springdoc.api-docs.path=/api/v1/pagos/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.mvc.cors.allowed-origins=http://localhost:9090
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# 2. Ordenar operaciones en la UI
springdoc.swagger-ui.operations-sorter=alpha

# 3. ESTA ES LA CLAVE: Indica que las llamadas deben ir al Gateway (9090)
#springdoc.server-url=http://localhost:9090